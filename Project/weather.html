<!DOCTYPE html>
<html>
<head>
<title>Weather App</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1d2671,#c33764);
}
#container{
    width:450px;
    padding:30px;
    border-radius:20px;
    text-align:center;
    color:white;
    background:rgba(255,255,255,.15);
}
h1{
    margin-bottom:30px;
}
input{
    width:100%;
    padding:15px;
    font-size:18px;
    border:none;
    border-radius:10px;
    margin-bottom:20px;
}
button{
    width:100%;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:10px;
    background:green;
    color:white;
    cursor:pointer;
}
#result{
    margin-top:30px;
    font-size:25px;
    line-height:40px;
}
</style>
</head>
<body>
<div id="container">
    <h1>☁ Weather App</h1>
    <input id="city" placeholder="Enter city">
    <button onclick="getWeather()">Search </button>
    <div id="result">Output</div>
</div>
<script>
async function getWeather(){
    let city=document.getElementById("city").value;
    let result=document.getElementById("result");
    try{
        let response=await fetch(`https://wttr.in/${city}?format=j1`);
        let data=await response.json();
        result.innerHTML=`
        📍 ${city}<br>
        🌡 ${data.current_condition[0].temp_C} °C<br>
        ☁ ${data.current_condition[0].weatherDesc[0].value}
        `;}
    catch{result.innerHTML="City not found";}
}
</script>
</body>
</html>
