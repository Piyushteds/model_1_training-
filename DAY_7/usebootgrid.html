<!doctype html>
<html>
<head>
    <title>Invitation Card</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-secondary-subtle d-flex justify-content-center align-items-center min-vh-100">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <div class="card shadow-lg rounded-4">

                    
                    <!-- Header -->
                    <div class="card-header bg-primary text-white text-center p-4">

                        <h1>Wedding Invitation</h1>

                    </div>



                    <!-- Main Content -->
                    <div class="card-body p-4">

                        <div class="row text-center mb-4">

                            <div class="col-12">

                                <h2 class="text-primary">You Are Invited</h2>

                                <p><b>Rahul ❤️ Priya</b></p>
                                <p>Date: 25 December 2026</p>
                                <p>Time: 7:00 PM</p>
                                <p>Venue: Silver Oak Garden, Ahmedabad</p>

                            </div>

                        </div>



                        <!-- Audio + Video -->
                        <div class="row g-4 mb-4">

                            
                            <!-- Audio -->
                            <div class="col-md-6 text-center">

                                <h3 class="text-primary">Invitation Music</h3>

                                <audio class="w-100" controls autoplay loop>

                                    <source src="WhatsApp Audio 2026-05-13 at 10.32.09 AM.mpeg" type="audio/mpeg">

                                </audio>

                            </div>



                            <!-- Video -->
                            <div class="col-md-6 text-center">

                                <h3 class="text-primary">Invitation Video</h3>

                                <video class="w-100 rounded" controls autoplay muted loop>

                                    <source src="WhatsApp Video 2026-05-13 at 10.41.44 AM.mp4" type="video/mp4">

                                </video>

                            </div>

                        </div>



                        <!-- Location -->
                        <div class="row">

                            <div class="col-12 text-center">

                                <h3 class="text-primary">Location</h3>

                                <iframe
                                class="w-100 rounded"
                                height="300"
                                src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d29383.13765156538!2d72.6344929!3d22.990991!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin"
                                allowfullscreen>
                                </iframe>

                            </div>

                        </div>

                    </div>



                    <!-- Footer -->
                    <div class="card-footer bg-primary text-white text-center p-3">

                        We are waiting for your presence ❤️

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
