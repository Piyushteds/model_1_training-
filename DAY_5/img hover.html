<!-- write a html code in  hover effect on image -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Hover Effect</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            /* min-height:100vh; */
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e293b);
            padding:20px;
        }

        .image-container{
            position:relative;
            width:300px;
            height:200px;
            overflow:hidden;
            border-radius:10px;
        }

        .image-container img{
            width:100%;
            height:100%;
            object-fit:fill;
            transition:0.5s;
        }

        .image-container:hover img{
            transform:scale(1.1);
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="image.png" alt="Nature Image">
    </div>
</body>
</html>
